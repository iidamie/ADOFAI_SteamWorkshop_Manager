name: Build and release Steam Workshop Manager

on:
  push:
    branches: [main]
    paths:
      - "*.cs"
      - "*.csproj"
      - "package_mod.py"
      - "README.md"
      - "THIRD-PARTY-NOTICES.md"
      - "licenses/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workshop-manager-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Checkout host reference source
        uses: actions/checkout@v4
        with:
          repository: StArraySharp/StArray.ModManager
          ref: 8a2b2375ed807c9a100a55f43b9075624822e8b2
          path: dependencies/StArray.ModManager

      - name: Build host references
        run: dotnet build dependencies/StArray.ModManager/StArray.ModManager.Android/StArray.ModManager.Android.csproj --configuration Release

      - name: Prepare compile references
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path
          output = Path("dependencies/StArray.ModManager/StArray.ModManager.Android/bin/Release/net10.0")
          package_root = Path(os.environ.get("NUGET_PACKAGES", Path.home() / ".nuget/packages"))
          imgui = package_root / "imgui.net/1.91.6.1/lib/net8.0/ImGui.NET.dll"
          Path("References").mkdir(exist_ok=True)
          shutil.copyfile(output / "StArray.ModManager.dll", "References/StArray.ModManager.dll")
          shutil.copyfile(imgui, "References/ImGui.NET.dll")

      - name: Build and package
        run: python3 package_mod.py

      - name: Read package version
        id: package
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          version = ET.parse("SteamWorkshopManager.csproj").findtext("./PropertyGroup/Version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\n")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamWorkshopManager-${{ steps.package.outputs.version }}
          path: |
            dist/SteamWorkshopManager-${{ steps.package.outputs.version }}.zip
            dist/SteamWorkshopManager-${{ steps.package.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Bump the project version before publishing another release."
              exit 1
            fi
          fi
          release_zip="dist/SteamWorkshopManager-$RELEASE_VERSION.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$release_zip" "$release_zip.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$release_zip" "$release_zip.sha256" \
              --target "$GITHUB_SHA" --title "Steam Workshop Manager $RELEASE_VERSION" --generate-notes
          fi
